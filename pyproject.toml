[project]
name = "lingua"
version = "0.1.0"
requires-python = ">=3.11"

[project.dependencies]
gradio = ">=4.0"
g2p = ">=1.0"
TTS = ">=0.21"
scipy = ">=1.11"
openai-whisper = ">=20231117"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
