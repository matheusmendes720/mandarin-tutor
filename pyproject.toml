[project]
name = "lingua"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gradio>=4.0",
    "scipy>=1.11",
    "openai-whisper>=20231117",
    "edge-tts>=6.1",
]

[project.optional-dependencies]
# Heavy backends kept optional because of install size / Python-version constraints.
asr = ["g2p>=1.0"]
tts-coqui = ["TTS>=0.21; python_version < '3.14'"]
accent-funasr = ["funasr>=1.0"]
voice-livekit = ["livekit>=0.17", "livekit-agents>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lingua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_temp"

[tool.ruff]
line-length = 88
